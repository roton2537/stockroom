  const words = term.split(/\s+/);
  const res = DB.fleet.filter(f=>words.every(w=>f.name.toLowerCase().includes(w)));
  box.innerHTML = res.length ? res.map(f=>`<button type="button" class="sg" data-act="k-add" data-id="${f.id}"><span><b>${esc(f.name)}</b></span><span class="sub">${f.category} · ${money0(f.monthlyFee)}/mo</span></button>`).join('') : '<div class="sg none">No matches.</div>';
  box.hidden = false;
}
function saveContract(){
  const d = kd;
  const c = {
    id:uid(), contractNo: nextNo(DB,'rc','RC-',4),
    customerId:d.customer, branchId:d.branch,
    startsOn:d.startsOn, termMonths:d.term, endsOn: cEnd(d.startsOn,d.term),
    interval:d.interval,
    status: d.startsOn>TODAY_ISO?'reserved':'active',
    depositHeld: d.lines.reduce((s,l)=>{ const f=DB.fleet.find(x=>x.id===l.fleetModelId); return s+l.qty*f.deposit; },0),
    damageCharged:0, endedOn:null,
    lines:d.lines.map(l=>({fleetModelId:l.fleetModelId, qty:l.qty, monthlyFee:l.monthlyFee, qtyLost:0})),
    oil: d.oil==='inc' ? { scent:d.scent, mlPerCycle: 0 } : null,
    refills:[]
  };
  if(c.oil){
    const perMonth = d.lines.reduce((s,l)=>{ const f=DB.fleet.find(x=>x.id===l.fleetModelId); return s+l.qty*f.oilMlPerMonth; },0);
    c.oil.mlPerCycle = perMonth * c.interval;
    for(let n=0; n<c.term/c.interval; n++){
      c.refills.push({seq:n+1, dueOn: addM(c.startsOn, n*c.interval), oilMl:c.oil.mlPerCycle, status:'scheduled', deliveredOn:null});
    }
  }
  DB.contracts.push(c);
  // register fleet bookings on the branch
  c.lines.forEach(l=>{
    const f = DB.fleet.find(x=>x.id===l.fleetModelId);
    f.stock[c.branchId].booked.push({contractId:c.id, qty:l.qty, start:c.startsOn, end:c.endsOn});
  });
  audit(DB,'Created contract','rental_contract',c.id,c.contractNo,`${c.lines.length} lines`);
  save(); closeSheet(); state.view='contracts'; render();
  toast('Created '+c.contractNo);
}

/* ============================================================================
   GLOBAL EVENT HANDLERS
   ========================================================================== */
document.addEventListener('click', e=>{
  if(e.target === $('#overlay')){ closeSheet(); return; }
  const a = e.target.closest('[data-act]');
  if(!a){
    if(!e.target.closest('.addrow')) $$('.sugg').forEach(s=>s.hidden=true);
    return;
  }
  const D = a.dataset;
  switch(D.act){
    case 'nav': state.view = D.view; render(); break;
    case 'close': closeSheet(); break;
    case 'reset': if(confirm('Reset all data?')){ localStorage.removeItem(DB_KEY); DB = seed(); save(); render(); toast('Reset complete'); } break;
    case 'switch-user': openSwitchUser(); break;

    case 'prod': openProduct(D.pid); break;
    case 'adjust': applyAdjustment(D.pid); break;
    case 'reorder': {
      const p = pfind(D.pid);
      openDoc('po',{branch:D.b, supplier: DB.suppliers.find(s=>s.categories.includes(p.category))?.id, lines:[{id:uid(), productId:p.id, qtyOrdered: Math.max(12, p.reorderLevel*3), unitCost:p.cost}]});
      break;
    }
    case 'page': {
      const s = state[D.list];
      s.page = Math.max(0, (s.page||0) + parseInt(D.d));
      if(D.list==='inv') updateInv(); else if(D.list==='ord') updateOrd();
      break;
    }

    case 'new-order': if(!userCan(DB,'so.create')){ toast('No permission'); break; } openDoc('order'); break;
    case 'new-po': if(!userCan(DB,'po.create')){ toast('No permission'); break; } openDoc('po'); break;
    case 'new-tr': if(!userCan(DB,'tr.create')){ toast('No permission'); break; } openDoc('transfer'); break;
    case 'new-adj': {
      if(!userCan(DB,'inv.adjust')){ toast('No permission'); break; }
      const p = DB.products[0];
      openProduct(p.id);
      break;
    }
    case 'new-contract': openContractDoc(); break;

    case 'doc-add': {
      const p = pfind(D.pid);
      if(draft.type==='transfer') draft.lines.push({id:uid(), productId:p.id, qty:1});
      else draft.lines.push({id:uid(), productId:p.id, qtyOrdered:1, unitPrice:p.price, discount:0, unitCost:p.cost});
      $('#d_search').value = ''; $('#d_sugg').hidden = true;
      renderDocLines();
      break;
    }
    case 'doc-rm': draft.lines.splice(parseInt(D.i),1); renderDocLines(); break;
    case 'doc-save': saveDoc(); break;

    case 'ord-open': openOrder(D.id); break;
    case 'ord-confirm': confirmOrderAction(D.id); break;
    case 'ord-dispatch': dispatchOrderAction(D.id); break;
    case 'ord-invoice': invoiceOrderAction(D.id); break;
    case 'ord-pay': payOrderAction(D.id); break;
    case 'ord-st': state.ord.st = D.st; state.ord.page = 0; views.orders(); break;

    case 'dn-open': openDelivery(D.id); break;
    case 'inv-open': openInvoice(D.id); break;
    case 'inv-pay': openPaymentSheet(D.id); break;
    case 'pay-save': savePaymentAction(D.id); break;

    case 'cust-open': openCustomer(D.id); break;
    case 'new-cust': openNewCustomer(); break;
    case 'cust-save': saveNewCustomer(); break;
    case 'cust-order': openDoc('order',{customer:D.id, branch: (DB.customers.find(c=>c.id===D.id)||{}).branch}); break;

    case 'po-open': openPO(D.id); break;
    case 'po-receive': receivePOAction(D.id); break;

    case 'tr-receive': receiveTransferAction(D.id); break;

    case 'ct-open': openContract(D.id); break;
    case 'ct-start': startContractAction(D.id); break;
    case 'ct-end': endContractAction(D.id); break;
    case 'rf-deliver': deliverRefillAction(D.id, parseInt(D.seq)); break;
    case 'ct-st': state.ct.st = D.st; views.contracts(); break;
    case 'rf-st': state.rf.st = D.st; views.refills(); break;

    case 'ap-approve': approveApprovalAction(D.id); break;
    case 'ap-reject': rejectApprovalAction(D.id); break;

    case 'usr-open': openUser(D.id); break;
    case 'usr-save': saveUserRole(D.id); break;

    case 'k-add': {
      const f = DB.fleet.find(x=>x.id===D.id);
      kd.lines.push({fleetModelId:f.id, qty:1, monthlyFee:f.monthlyFee});
      $('#k_search').value = ''; $('#k_sugg').hidden = true;
      renderContractLines();
      break;
    }
    case 'k-rm': kd.lines.splice(parseInt(D.i),1); renderContractLines(); break;
    case 'k-save': saveContract(); break;

    case 'rep-sel': state.rep.sel = D.rep; views.reports(); break;

    case 'export': exportCSV(D.what); break;
    case 'import-products': importProducts(); break;
    case 'import-customers': importCustomers(); break;

    case 'print': window.print(); break;
  }
});

document.addEventListener('input', e=>{
  const k = e.target.dataset && e.target.dataset.bind;
  if(!k) return;
  switch(k){
    case 'invQ': state.inv.q = e.target.value; state.inv.page = 0; updateInv(); break;
    case 'ordQ': state.ord.q = e.target.value; state.ord.page = 0; updateOrd(); break;
    case 'custQ': state.cust.q = e.target.value; views.customers(); break;
    case 'ctQ': state.ct.q = e.target.value; views.contracts(); break;
    case 'ledQ': state.led.q = e.target.value; views.ledger(); break;
    case 'd_search': suggest(e.target.value); break;
    case 'd_disc': draft.discountTotal = parseFloat(e.target.value)||0; refreshDoc(); break;
    case 'd_qty': {
      const i = parseInt(e.target.dataset.i); const p = pfind(draft.lines[i].productId);
      const v = parseFloat(e.target.value)||0;
      if(draft.type==='transfer') draft.lines[i].qty = v; else draft.lines[i].qtyOrdered = v;
      refreshDoc();
      break;
    }
    case 'd_price': {
      const i = parseInt(e.target.dataset.i); const v = parseFloat(e.target.value)||0;
      if(draft.type==='po') draft.lines[i].unitCost = v; else draft.lines[i].unitPrice = v;
      refreshDoc();
      break;
    }
    case 'k_search': suggestFleet(e.target.value); break;
    case 'k_qty': kd.lines[parseInt(e.target.dataset.i)].qty = parseInt(e.target.value)||0; refreshContract(); break;
    case 'k_fee': kd.lines[parseInt(e.target.dataset.i)].monthlyFee = parseFloat(e.target.value)||0; refreshContract(); break;
    case 'org_name': DB.org.name = e.target.value; save(); break;
  }
});

document.addEventListener('change', e=>{
  const t = e.target;
  if(t.id==='invCat'){ state.inv.cat = t.value; state.inv.page = 0; updateInv(); return; }
  if(t.id==='invSt'){ state.inv.st = t.value; state.inv.page = 0; updateInv(); return; }
  if(t.dataset.bind==='ledMov'){ state.led.movement = t.value; views.ledger(); return; }
  if(t.id==='branchSel'){ state.branch = t.value; render(); return; }
  if(t.id==='d_branch'){ draft.branch = t.value; if(draft.to===draft.branch) draft.to = DB.branches.find(b=>b.id!==draft.branch).id;
    if(draft.type==='order'){ const list = DB.customers.filter(c=>c.branch===draft.branch); if(!list.find(c=>c.id===draft.customer)) draft.customer = list[0]?.id; }
    renderDoc(); return; }
  if(t.id==='d_customer'){ draft.customer = t.value; return; }
  if(t.id==='d_sup'){ draft.supplier = t.value; const cats = DB.suppliers.find(s=>s.id===t.value).categories; draft.lines = draft.lines.filter(l=>cats.includes(pfind(l.productId).category)); if(!draft.lines.length) seedLines(); renderDoc(); return; }
  if(t.id==='d_to'){ draft.to = t.value; refreshDoc(); return; }
  if(t.id==='d_exp'){ draft.expectedOn = t.value; return; }
  if(t.id==='k_branch'){ kd.branch = t.value; const list = DB.customers.filter(c=>c.branch===kd.branch); if(!list.find(c=>c.id===kd.customer)) kd.customer = list[0]?.id; renderContractDoc(); return; }
  if(t.id==='k_customer'){ kd.customer = t.value; return; }
  if(t.id==='k_start'){ kd.startsOn = t.value; refreshContract(); return; }
  if(t.id==='k_term'){ kd.term = parseInt(t.value); refreshContract(); return; }
  if(t.id==='k_interval'){ kd.interval = parseInt(t.value); refreshContract(); return; }
  if(t.id==='k_scent'){ kd.scent = t.value; refreshContract(); return; }
  if(t.id==='k_oil'){ kd.oil = t.value; renderContractDoc(); return; }
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && !$('#overlay').hidden){ closeSheet(); return; }
  if(e.key==='Enter' && e.target.tagName==='TR' && e.target.dataset.act) e.target.click();
});

/* ---------- new customer ---------- */
function openNewCustomer(){
  const b0 = state.branch==='all' ? 'DHK' : state.branch;
  openSheet(`
  <div class="sheet narrow" role="dialog" aria-modal="true">
    <div class="sheet-h"><h2>New customer</h2><button class="x" data-act="close">×</button></div>
    <div class="sheet-b">
      <div class="fgrid">
        <label class="f">Business name<input id="nc_name" class="in" autocomplete="off"></label>
        <label class="f">Type<select id="nc_type">${['Hotel or resort','Office','Clinic','Spa or salon','Restaurant or cafe','Retail or showroom','Reseller'].map(t=>`<option>${t}</option>`).join('')}</select></label>
        <label class="f">Branch<select id="nc_branch">${DB.branches.map(b=>`<option value="${b.id}"${b.id===b0?' selected':''}>${esc(b.name)}</option>`).join('')}</select></label>
        <label class="f">Phone<input id="nc_phone" class="in"></label>
        <label class="f">Credit limit (৳)<input id="nc_limit" class="in" type="number" min="0" step="1000" value="50000"></label>
      </div>
      <div id="nc_err" class="msg"></div>
    </div>
    <div class="sheet-f"><span></span><div class="btns"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="cust-save">Save</button></div></div>
  </div>`);
}
function saveNewCustomer(){
  const name = $('#nc_name').value.trim();
  if(!name){ $('#nc_err').textContent = 'Name required'; return; }
  const code = 'C'+pad(1001+DB.customers.length,4);
  DB.customers.push({ id:uid(), code, name, type:$('#nc_type').value, branch:$('#nc_branch').value,
    limit:parseFloat($('#nc_limit').value)||0, phone:$('#nc_phone').value, contact:'', address:'', since:TODAY_ISO });
  audit(DB,'Created customer','customer',null,code,name);
  save(); closeSheet(); views.customers(); toast('Added '+code);
}

/* ---------- switch user ---------- */
function openSwitchUser(){
  openSheet(`
  <div class="sheet narrow" role="dialog" aria-modal="true">
    <div class="sheet-h"><h2>Switch user</h2><button class="x" data-act="close">×</button></div>
    <div class="sheet-b">
      <p class="sub">This is a local demo. In production, users sign in via Supabase Auth.</p>
      <ul class="rows">${DB.users.map(u=>`<li><div class="main"><div>${esc(u.name)}</div><div class="sub">${esc(u.role)} · ${esc(u.email)}</div></div><button class="btn small" data-act="usr-switch" data-id="${u.id}">Use</button></li>`).join('')}</ul>
    </div>
    <div class="sheet-f"><span></span><div class="btns"><button class="btn" data-act="close">Close</button></div></div>
  </div>`);
}
document.addEventListener('click', e=>{
  const a = e.target.closest('[data-act="usr-switch"]');
  if(!a) return;
  DB.currentUserId = a.dataset.id;
  save(); closeSheet(); render(); toast('Switched user');
});

/* ============================================================================
   RENDER
   ========================================================================== */
function render(){
  if(!DB) DB = load() || seed();
  renderNav();
  renderBranchSel();
  $('#viewTitle').textContent = TITLES[state.view] || 'Overview';
  const fn = views[state.view] || views.overview;
  fn();
  save();
}

/* boot */
DB = load() || seed();
save();
render();
</script>
