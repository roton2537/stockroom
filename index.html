<!doctype html>
<html lang="en">
<head>  
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stockroom ERP</title>
<style>
:root{
  --bg:#F1F4F3;--surface:#FFFFFF;--ink:#13211D;--muted:#566762;--line:#D9E1DE;--hover:#F0F6F4;
  --accent:#0E6B5B;--accent-ink:#FFFFFF;--accent-soft:#D9EFE9;
  --good:#17703F;--good-soft:#DAF0E2;--warn:#8F5A00;--warn-soft:#FAEBC9;--crit:#B0261D;--crit-soft:#FADFDB;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1513;--surface:#161F1C;--ink:#E4EEEA;--muted:#93A59E;--line:#26332F;--hover:#1B2724;
  --accent:#3DBFA0;--accent-ink:#06211B;--accent-soft:#17352E;
  --good:#5FD08C;--good-soft:#173324;--warn:#F0B84A;--warn-soft:#3A2D10;--crit:#FF8A7E;--crit-soft:#3E1C18;
}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 var(--f-body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);letter-spacing:-.01em}
ul{margin:0;padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:0;height:0}
.mono{font-family:var(--f-mono);font-size:12px}
.sub{color:var(--muted);font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;padding:0 8px;display:flex;align-items:baseline;gap:6px}
.brand small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:4px;font-family:var(--f-body);font-weight:600}
.navgrp{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 8px 2px}
#nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
#nav button:hover{background:var(--hover);color:var(--ink)}
#nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{margin-left:auto;font-size:10px;font-variant-numeric:tabular-nums;background:var(--bg);color:var(--muted);border-radius:10px;padding:1px 6px;font-weight:600}
#nav button[aria-current="page"] .badge{background:var(--surface);color:var(--accent)}
.rail-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:8px}
main{min-width:0;padding:16px clamp(14px,3vw,28px) 60px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:24px}
.scope{display:flex;gap:8px;align-items:center}
.in,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:36px;max-width:100%}
.in:hover,select:hover{border-color:var(--muted)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 14px;min-height:36px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:26px;padding:3px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--crit)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 220px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 12px;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip b{font-variant-numeric:tabular-nums;margin-left:4px;font-weight:600}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover td{background:var(--hover)}
.pn{font-weight:500}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.idle{background:var(--bg);color:var(--muted)}
.c-low{color:var(--warn);font-weight:600}
.c-out{color:var(--crit);font-weight:600}
.mv-in{color:var(--good);font-weight:600}
.mv-out{color:var(--crit);font-weight:600}
.empty{padding:24px 16px;color:var(--muted);text-align:center}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line);border-top:1px solid var(--line);margin:-1px 0 0 -1px;min-width:0}
.kpi .l{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:11px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 span{font-size:11px;color:var(--muted);font-weight:500}
.card h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 0 2px}
.rows li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0;padding-top:0}
.rows .main{min-width:0;flex:1}
.rows .main>div:first-child{font-weight:500;overflow-wrap:anywhere}
.rows li[data-act]{cursor:pointer}
.rows li[data-act]:hover{background:var(--hover)}
.bars{display:flex;flex-direction:column;gap:8px}
.bars li{display:grid;grid-template-columns:minmax(80px,1.2fr) 2fr auto;gap:10px;align-items:center}
.bt{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bv{font-variant-numeric:tabular-nums;font-weight:500;text-align:right;font-size:12px}
.callout{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:12px}
.callout.warn{background:var(--warn-soft)}
.callout.crit{background:var(--crit-soft)}
.overlay{position:fixed;inset:0;background:rgba(8,16,13,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--surface);border-radius:12px;width:100%;max-width:640px;max-height:100%;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3);min-height:0}
.sheet.wide{max-width:880px}
.sheet.narrow{max-width:440px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet-b{padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.sheet-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--line)}
.x{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 6px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.meta div span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
.f input,.f select,.f textarea{font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink);width:100%}
.bill{display:flex;flex-direction:column;gap:5px;max-width:380px;margin-left:auto;width:100%}
.bill div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;font-size:13px}
.bill .total{border-top:1px solid var(--line);padding-top:5px;font-weight:600}
.tot{font-family:var(--f-display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:2px}
.steps{display:flex;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted);font-weight:500}
.steps li{display:flex;align-items:center;white-space:nowrap}
.steps li+li::before{content:'';display:inline-block;width:14px;height:1px;background:var(--line);margin:0 7px}
.steps li.done{color:var(--good)}
.steps li.done::before{background:var(--good)}
.steps li.now{color:var(--accent);font-weight:600}
.msg{color:var(--crit);font-size:12px;font-weight:500}
tr.err td{background:var(--crit-soft)}
tr.err input.qty:not(.price){border-color:var(--crit)}
input.qty{width:84px;text-align:right}
input.price{width:100px;text-align:right}
.addrow{position:relative}
.addrow input{width:100%}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5;max-height:280px;overflow:auto}
.sg{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;cursor:pointer;font-size:13px}
.sg:hover{background:var(--hover)}
.sg:last-child{border-bottom:0}
.sg.none{color:var(--muted);cursor:default}
.usr{position:relative}
.usr summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 10px 4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.usr summary::-webkit-details-marker{display:none}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex:none}
.usr b{font-size:12px;display:block;line-height:1.25}
.usr small{color:var(--muted);font-size:10px;display:block}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:230px;z-index:9;padding:6px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;cursor:pointer;font-size:13px}
.menu button:hover{background:var(--hover)}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.doc-h{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:12px}
.doc-h .brand{padding:0;font-size:18px}
.doc .docno{font-family:var(--f-display);font-weight:700;font-size:20px;text-align:right}
.sig{margin-top:26px;display:flex;gap:40px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.sig i{display:block;border-top:1px solid var(--muted);margin-top:24px;min-width:160px;font-style:normal}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:500;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix .y{color:var(--good);font-weight:700}
.matrix .n{color:var(--muted);opacity:.5}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;padding:10px 12px}
  #nav{flex-direction:row;overflow-x:auto;display:flex;gap:4px}
  .navgrp{display:none}
  #nav button{width:auto;white-space:nowrap;font-size:12px}
  .rail-foot{display:none}
}
@media (max-width:520px){
  .overlay{padding:0;align-items:flex-end}
  .sheet{border-radius:12px 12px 0 0;max-height:94%}
}
@media print{.rail,.top,#toast,.sheet-h .x,.sheet-f,.no-print{display:none!important}.app{grid-template-columns:1fr}.overlay{position:static;background:none;padding:0;display:block}.sheet{box-shadow:none;max-width:none}.sheet-b{overflow:visible}.doc{border:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">Stockroom<small>ERP</small></div>
    <nav id="nav" aria-label="Modules"></nav>
    <div class="rail-foot">Local data. <button class="linkbtn" data-act="reset">Reset demo</button></div>
  </aside>
  <main>
    <header class="top">
      <h1 id="viewTitle">Overview</h1>
      <div class="scope">
        <select id="branchSel" aria-label="Branch"></select>
        <details class="usr"><summary><span class="avatar" id="userAv">AK</span><span><b id="userName">Ayesha Karim</b><small id="userRole">Branch Manager</small></span></summary>
          <div class="menu">
            <div class="who"><b id="mUserName">Ayesha Karim</b><div class="sub" id="mUserEmail">ayesha@stockroom.demo</div></div>
            <button type="button" data-act="nav" data-view="users">Users &amp; roles</button>
            <button type="button" data-act="nav" data-view="audit">My activity</button>
            <button type="button" data-act="switch-user">Switch user…</button>
            <button type="button" data-act="reset">Reset all data</button>
          </div>
        </details>
      </div>
    </header>
    <section id="view" aria-live="polite"></section>
  </main>
</div>
<div id="overlay" class="overlay" hidden><div id="sheetHost" style="display:contents"></div></div>
<div id="toast" role="status"></div>

<script>
/* ============================================================================
   STOCKROOM ERP — real working core
   Persistence: localStorage 'stockroom.db.v1'
   Money: integer paisa internally to avoid float drift; displayed as ৳X,XXX.XX
   ========================================================================== */
"use strict";

/* ---------- money & numbers ---------- */
const money = n => '৳' + (Math.round(n*100)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => '৳' + Math.round(n).toLocaleString('en-IN');
const num = n => Math.round(n).toLocaleString('en-IN');
const qf = (p,q) => p.unit==='kg' || p.unit==='l' ? (+q.toFixed(3)).toLocaleString('en-IN') : num(q);
const kfmt = v => v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(1)+'k':String(Math.round(v));
const pad = (n,l) => String(n).padStart(l,'0');
const TODAY = new Date(); TODAY.setHours(12,0,0,0);
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const TODAY_ISO = iso(TODAY);
const dshort = s => { const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-GB',{day:'numeric',month:'short'}); };
const dyear  = s => { const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); };
const dayDiff = (a,b) => Math.round((Date.parse(b)-Date.parse(a))/864e5);
const addM = (s,n) => { const p=s.split('-').map(Number); const dim=new Date(p[0],p[1]-1+n+1,0).getDate(); return iso(new Date(p[0],p[1]-1+n,Math.min(p[2],dim),12)); };
const cEnd = (start,months) => iso(addDays(new Date(addM(start,months)+'T12:00:00'),-1));
const nowT = () => { const d=new Date(); return pad(d.getHours(),2)+':'+pad(d.getMinutes(),2); };
const nowISO = () => new Date().toISOString();
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const clamp = (n,a,b) => Math.max(a, Math.min(b, n));

/* ---------- persistence ---------- */
const DB_KEY = 'stockroom.db.v1';
let DB = null;
let saveTimer = null;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){ toast('Save failed: '+e.message); } }, 120); }
function load(){ try{ const raw = localStorage.getItem(DB_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }

/* ---------- seed ---------- */
function seed(){
  const rnd = (s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(20261010);
  const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const pick=a=>a[Math.floor(rnd()*a.length)];

  const branches=[{id:'DHK',name:'Dhaka Hub'},{id:'CTG',name:'Chattogram'},{id:'RAJ',name:'Rajshahi'},{id:'KHL',name:'Khulna'}];
  const scents=['Oud Royale','White Musk','Amber Wood','Jasmine Night','Sandalwood','Rose Garden','Citrus Fresh','Ocean Breeze','Vanilla Bean','Lavender Calm','Green Tea','Black Orchid'];
  const density={}; scents.forEach(s=>density[s]=+(0.85+rnd()*0.13).toFixed(3));

  const cats=[
    {code:'OIL',name:'Fragrance oils',trackLots:false},
    {code:'DEV',name:'Diffuser devices',trackLots:false},
    {code:'PRT',name:'Parts & accessories',trackLots:false},
    {code:'RDS',name:'Room scents',trackLots:false},
    {code:'PKG',name:'Packaging',trackLots:false},
    {code:'BLK',name:'Bulk oil (kg)',trackLots:false,unit:'kg'},
    {code:'DAI',name:'Dairy',trackLots:true},
    {code:'BEV',name:'Beverages',trackLots:true},
    {code:'GRO',name:'Grocery staples',trackLots:true},
    {code:'SNK',name:'Snacks & bakery',trackLots:true},
    {code:'FRZ',name:'Frozen',trackLots:true},
    {code:'HHD',name:'Household',trackLots:false},
    {code:'PCR',name:'Personal care',trackLots:false}
  ];

  const products=[];
  let pn=0;
  scents.forEach((sc,i)=>{
    const f=i<2?1.4:1+((i*7)%5)*0.06;
    const mkSku=()=>'OIL-'+pad(++pn,4);
    products.push({id:uid(),sku:mkSku(),name:sc+' Fragrance Oil 100 ml',category:'OIL',scent:sc,volumeMl:100,unit:'pcs',cost:Math.round(1100*f/10)*10,price:Math.round(1500*f/10)*10,reorderLevel:12,trackLots:false,stock:{},barcodes:[]});
    products.push({id:uid(),sku:mkSku(),name:sc+' Fragrance Oil 500 ml',category:'OIL',scent:sc,volumeMl:500,unit:'pcs',cost:Math.round(5000*f/10)*10,price:Math.round(6800*f/10)*10,reorderLevel:8,trackLots:false,stock:{},barcodes:[]});
    products.push({id:uid(),sku:'BLK-'+pad(++pn,4),name:sc+' Oil (bulk), per kg',category:'BLK',scent:sc,unit:'kg',cost:Math.round(7500*f/50)*50,price:Math.round(9500*f/50)*50,reorderLevel:6,trackLots:false,stock:{},barcodes:[]});

function seedActivity(db){
  const today = new Date(TODAY);
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
  // a few sales orders across the last two weeks
  for(let d=14; d>=0; d--){
    const date = iso(addDays(today,-d));
    const n = ri(1,3) - (d===0?1:0);
    for(let k=0;k<n;k++){
      const cust = pick(db.customers);
      const lines = [];
      const used = new Set();
      const nl = ri(2,4);
      for(let i=0;i<nl;i++){
        const p = pick(db.products.filter(x=>x.category!=='BLK'&&x.stock[cust.branch].physical>5));
        if(!p || used.has(p.id)) continue;
        used.add(p.id);
        const q = p.price>10000?ri(1,2):p.price>2000?ri(1,4):ri(3,12);
        lines.push({id:uid(),productId:p.id,qtyOrdered:q,qtyReserved:0,qtyDelivered:0,qtyInvoiced:0,unitPrice:p.price,discount:0});
      }
      if(!lines.length) continue;
      const order = makeSalesOrder(db,{
        branchId:cust.branch, customerId:cust.id,
        lines, status:'paid',
        orderedOn:date, orderedAt:pad(ri(8,17),2)+':'+pad(ri(0,59),2)
      });
      order.status='delivered';
      order.lines.forEach(l=>l.qtyDelivered=l.qtyOrdered);
      // make a matching invoice, mark paid
      const inv = makeInvoice(db, order);
      inv.status='paid';
      inv.amountPaid=inv.total;
      order.status='paid';
      // apply physical stock drop for these
      lines.forEach(l=>{
        const p = db.products.find(x=>x.id===l.productId);
        p.stock[cust.branch].physical = Math.max(0, p.stock[cust.branch].physical - l.qtyDelivered);
      });
    }
  }
  // recompute counters
  db.counters.so = Math.max(db.counters.so, 24200 + db.salesOrders.length);
  db.counters.inv = Math.max(db.counters.inv, 7012 + db.invoices.length);
}

/* ---------- numbered documents ---------- */
function nextNo(db, key, prefix, padLen=5){
  db.counters[key] = (db.counters[key]||0) + 1;
  return prefix + pad(db.counters[key], padLen);
}

/* ---------- ledger ---------- */
function ledgerEntry(db, {movement, productId, branchId, qtyPhysical=0, qtyReserved=0, unitCost=null, sourceType, sourceId, reference, reason, userId}){
  const txnNo = 'TXN-' + pad(++db.counters.txn, 8);
  const p = db.products.find(x=>x.id===productId);
  const bal = p.stock[branchId] || (p.stock[branchId]={physical:0,reserved:0});
  bal.physical = +(bal.physical + qtyPhysical).toFixed(3);
  bal.reserved = +(bal.reserved + qtyReserved).toFixed(3);
  if(bal.physical < 0) bal.physical = 0;
  if(bal.reserved < 0) bal.reserved = 0;
  const entry = {
    txnNo, at: nowISO(), movement, productId, branchId,
    qtyPhysicalDelta: qtyPhysical, qtyReservedDelta: qtyReserved,
    unitCost, balancePhysical: bal.physical, balanceReserved: bal.reserved,
    sourceType, sourceId, reference, reason,
    userId
  };
  db.ledger.push(entry);
  return entry;
}

/* ---------- audit ---------- */
function audit(db, action, entityType, entityId, reference, details){
  const u = db.users.find(x=>x.id===db.currentUserId) || {name:'System', role:'System'};
  db.audit.unshift({ id:uid(), at: nowISO(), userId:u.id, userName:u.name, role:u.role,
    action, entityType, entityId, reference, details });
  if(db.audit.length > 500) db.audit.length = 500;
}

/* ---------- sales orders ---------- */
function computeOrderTotals(o){
  const sub = o.lines.reduce((s,l)=>s + l.qtyOrdered*l.unitPrice - (l.discount||0), 0);
  o.subtotal = +sub.toFixed(2);
  o.total = +Math.max(0, sub - (o.discountTotal||0)).toFixed(2);
  o.balanceDue = +(o.total - (o.amountPaid||0)).toFixed(2);
  return o;
}
function makeSalesOrder(db, {branchId, customerId, lines, status='draft', orderedOn, orderedAt, discountTotal=0}){
  const order = {
    id: uid(),
    orderNo: nextNo(db,'so','SO-'),
    branchId, customerId,
    orderedOn: orderedOn || TODAY_ISO,
    orderedAt: orderedAt || nowT(),
    status,
    lines: lines.map((l,i)=>({ ...l, id:l.id||uid(), lineNo:i+1, qtyReserved:l.qtyReserved||0, qtyDelivered:l.qtyDelivered||0, qtyInvoiced:l.qtyInvoiced||0, discount:l.discount||0 })),
    discountTotal, amountPaid: 0,
    createdAt: nowISO(), createdBy: db.currentUserId
  };
  computeOrderTotals(order);
  db.salesOrders.push(order);
  audit(db,'Created sales order','sales_order',order.id,order.orderNo, `${order.lines.length} lines, ${money0(order.total)}`);
  return order;
}

function confirmOrder(db, orderId){
  const o = db.salesOrders.find(x=>x.id===orderId);
  if(!o || o.status !== 'draft') return {ok:false,err:'Only drafts can be confirmed'};
  const u = db.users.find(x=>x.id===db.currentUserId);
  // credit limit check
  const cust = db.customers.find(x=>x.id===o.customerId);
  const exposure = customerExposure(db, cust.id);
  const overCredit = cust.limit>0 && (exposure + o.total) > cust.limit;
  // discount authority
  const discPct = o.subtotal ? (o.discountTotal / o.subtotal) * 100 : 0;
  const maxDisc = permissionLimit(db, u.role, 'so.discount');
  const overDisc = discPct > (maxDisc||0);
  const orderLimit = permissionLimit(db, u.role, 'so.approve');
  const overAmount = orderLimit !== true && orderLimit !== false && o.total > orderLimit;
  if(overCredit || overDisc || overAmount){
    const reasons = [overCredit?'over credit limit':'', overDisc?'discount '+discPct.toFixed(1)+'% over own '+maxDisc+'%':'', overAmount?'amount '+money0(o.total)+' over own limit':''].filter(Boolean).join(' · ');
    const ap = { id:uid(), approvalNo: nextNo(db,'ap','AP-',4), entityType:'sales_order', entityId:o.id, entityNo:o.orderNo,
      requestType:'order_discount', amount:o.total, requestedBy:u.id, requestedByName:u.name, requestedRole:u.role,
      branchId:o.branchId, detail:reasons, status:'pending', createdAt:nowISO() };
    db.approvals.unshift(ap);
    audit(db,'Submitted order for approval','sales_order',o.id,o.orderNo, reasons);
    o.status = 'submitted';
    return {ok:true, routed:true, approval:ap};
  }
  // immediate confirm → reserve
  o.lines.forEach(l=>{
    ledgerEntry(db,{movement:'order_reserved',productId:l.productId,branchId:o.branchId,qtyReserved:l.qtyOrdered,sourceType:'sales_order',sourceId:o.id,reference:o.orderNo+' reserved',userId:u.id});
    l.qtyReserved = l.qtyOrdered;
  });
  o.status = 'confirmed';
  audit(db,'Confirmed order','sales_order',o.id,o.orderNo, `Reserved ${o.lines.length} lines`);
  return {ok:true};
}

function approveOrder(db, approvalId){
  const ap = db.approvals.find(x=>x.id===approvalId);
  if(!ap || ap.status!=='pending') return {ok:false,err:'Not pending'};
  const decider = db.users.find(x=>x.id===db.currentUserId);
  if(decider.id === ap.requestedBy) return {ok:false,err:'Cannot approve own request'};
  const o = db.salesOrders.find(x=>x.id===ap.entityId);
  if(!o) return {ok:false,err:'Order not found'};
  ap.status='approved'; ap.decidedBy=decider.id; ap.decidedAt=nowISO();
  o.lines.forEach(l=>{
    ledgerEntry(db,{movement:'order_reserved',productId:l.productId,branchId:o.branchId,qtyReserved:l.qtyOrdered,sourceType:'sales_order',sourceId:o.id,reference:o.orderNo+' reserved',userId:decider.id});
    l.qtyReserved = l.qtyOrdered;
  });
  o.status='confirmed'; o.approvalId=ap.id;
  audit(db,'Approved order','sales_order',o.id,o.orderNo, 'by '+decider.name);
  return {ok:true};
}

function rejectOrder(db, approvalId, note){
  const ap = db.approvals.find(x=>x.id===approvalId);
  if(!ap || ap.status!=='pending') return {ok:false,err:'Not pending'};
  const o = db.salesOrders.find(x=>x.id===ap.entityId);
  ap.status='rejected'; ap.decidedBy=db.currentUserId; ap.decidedAt=nowISO(); ap.decisionNote=note||'';
  if(o) o.status='cancelled';
  audit(db,'Rejected order','sales_order',o?.id,o?.orderNo, note||'');
  return {ok:true};
}

/* ---------- delivery ---------- */
function makeDeliveryNote(db, orderId, partial){
  const o = db.salesOrders.find(x=>x.id===orderId);
  if(!o || o.status!=='confirmed') return {ok:false,err:'Only confirmed orders can be dispatched'};
  const dn = {
    id:uid(), dnNo: nextNo(db,'dn','DN-',5),
    orderId:o.id, orderNo:o.orderNo, branchId:o.branchId, customerId:o.customerId,
    dnDate: TODAY_ISO, slot:'Morning', carrier:'Own van',
    status:'delivered', deliveredAt: nowISO(),
    lines: o.lines.filter(l=>l.qtyDelivered < l.qtyOrdered).map(l=>{
      const qty = partial ? Math.min(l.qtyOrdered-l.qtyDelivered, Math.ceil((l.qtyOrdered-l.qtyDelivered)/2)) : (l.qtyOrdered-l.qtyDelivered);
      return { id:uid(), orderLineId:l.id, productId:l.productId, qty:qty };
    })
  };
  // Apply: physical decrease, reserved release
  dn.lines.forEach(dl=>{
    const l = o.lines.find(x=>x.id===dl.orderLineId);
    ledgerEntry(db,{movement:'dispatch',productId:dl.productId,branchId:o.branchId,qtyPhysical:-dl.qty,qtyReserved:-dl.qty,sourceType:'delivery_note',sourceId:dn.id,reference:dn.dnNo+' · '+o.orderNo,userId:db.currentUserId});
    l.qtyDelivered += dl.qty;
    l.qtyReserved = Math.max(0, l.qtyReserved - dl.qty);
  });
  db.deliveryNotes.push(dn);
  const allDone = o.lines.every(l=>l.qtyDelivered >= l.qtyOrdered);
  o.status = allDone ? 'delivered' : 'partially_delivered';
  audit(db,'Dispatched delivery note','delivery_note',dn.id,dn.dnNo, `${dn.lines.length} lines · ${o.orderNo}`);
  return {ok:true, dn};
}

/* ---------- invoices ---------- */
function makeInvoice(db, order){
  const o = typeof order === 'string' ? db.salesOrders.find(x=>x.id===order) : order;
  if(!o) return {ok:false,err:'Order not found'};
  if(!['delivered','partially_delivered'].includes(o.status)) return {ok:false,err:'Order not delivered'};
  const lines = o.lines.filter(l=>l.qtyDelivered > l.qtyInvoiced).map(l=>{
    const p = db.products.find(x=>x.id===l.productId);
    return { id:uid(), orderLineId:l.id, productId:l.productId, qty:l.qtyDelivered-l.qtyInvoiced, unitPrice:l.unitPrice, cogsUnitCost:p.cost };
  });
  if(!lines.length) return {ok:false,err:'Nothing to invoice'};
  const subtotal = lines.reduce((s,l)=>s+l.qty*l.unitPrice,0);
  const inv = {
    id:uid(), invoiceNo: nextNo(db,'inv','INV-',6),
    orderId:o.id, orderNo:o.orderNo, customerId:o.customerId, branchId:o.branchId,
    invoiceDate: TODAY_ISO, dueDate: iso(addDays(TODAY,14)),
    subtotal:+subtotal.toFixed(2), discountTotal:0, taxTotal:0,
    total:+subtotal.toFixed(2), amountPaid:0, balance:+subtotal.toFixed(2),
    status:'open', lines
  };
  db.invoices.push(inv);
  lines.forEach(l=>{ o.lines.find(x=>x.id===l.orderLineId).qtyInvoiced += l.qty; });
  const allInvoiced = o.lines.every(l=>l.qtyInvoiced >= l.qtyDelivered);
  if(allInvoiced && o.status==='delivered') o.status='invoiced';
  audit(db,'Created invoice','invoice',inv.id,inv.invoiceNo, `${money0(inv.total)} · ${o.orderNo}`);
  return {ok:true, inv};
}

/* ---------- payments ---------- */
function recordPayment(db, {invoiceId, amount, method, reference, direction='in', supplierId, notes}){
  const amt = Math.round(amount*100)/100;
  if(amt <= 0) return {ok:false,err:'Amount must be positive'};
  const pay = {
    id:uid(), paymentNo: nextNo(db,'pay', direction==='in'?'RCP-':'PAY-',4),
    direction, method, reference: reference||'', amount:amt, allocatedAmount:0,
    paidOn: TODAY_ISO, recordedBy: db.currentUserId, createdAt: nowISO()
  };
  if(direction==='in' && invoiceId){
    const inv = db.invoices.find(x=>x.id===invoiceId);
    if(!inv) return {ok:false,err:'Invoice not found'};
    const apply = Math.min(amt, inv.total - inv.amountPaid);
    inv.amountPaid = +(inv.amountPaid + apply).toFixed(2);
    inv.balance = +(inv.total - inv.amountPaid).toFixed(2);
    inv.status = inv.balance<=0 ? 'paid' : 'partially_paid';
    pay.allocatedAmount = apply;
    pay.customerId = inv.customerId;
    pay.invoiceId = inv.id;
    const o = db.salesOrders.find(x=>x.id===inv.orderId);
    if(o){ o.amountPaid = +(o.amountPaid||0) + apply; computeOrderTotals(o);
      if(o.balanceDue<=0 && o.status==='invoiced') o.status='paid'; }
    audit(db,'Recorded customer payment','payment',pay.id,pay.paymentNo, `${money0(apply)} against ${inv.invoiceNo}`);
  } else if(direction==='out' && supplierId){
    pay.supplierId = supplierId;
    audit(db,'Recorded supplier payment','payment',pay.id,pay.paymentNo, `${money0(amt)} to supplier`);
  }
  db.payments.push(pay);
  return {ok:true, payment:pay};
}

function makePurchaseOrder(db, {supplierId, branchId, lines, expectedOn}){
  const po = {
    id:uid(), poNo: nextNo(db,'po','PO-',4),
    supplierId, branchId, orderedOn: TODAY_ISO, expectedOn: expectedOn || iso(addDays(TODAY,5)),
    status:'ordered',
    lines: lines.map((l,i)=>({...l, id:uid(), lineNo:i+1, qtyReceived:0})),
    subtotal:0, createdAt: nowISO(), createdBy: db.currentUserId
  };
  po.subtotal = +po.lines.reduce((s,l)=>s+l.qtyOrdered*l.unitCost,0).toFixed(2);
  db.purchaseOrders.push(po);
  audit(db,'Created purchase order','purchase_order',po.id,po.poNo, `${po.lines.length} lines · ${money0(po.subtotal)}`);
  return po;
}

function receivePurchaseOrder(db, poId){
  const po = db.purchaseOrders.find(x=>x.id===poId);
  if(!po || po.status !== 'ordered') return {ok:false,err:'PO not open'};
  const grn = {
    id:uid(), grnNo: nextNo(db,'grn','GRN-',5),
    poId:po.id, poNo:po.poNo, supplierId:po.supplierId, branchId:po.branchId,
    receivedOn: TODAY_ISO,
    lines: po.lines.map(l=>({ ...l, id:uid(), qtyReceived:l.qtyOrdered, qtyRejected:0 }))
  };
  grn.lines.forEach(gl=>{
    const p = db.products.find(x=>x.id===gl.productId);
    // weighted-average cost
    const bal = p.stock[po.branchId];
    const newTotal = bal.physical * p.cost + gl.qtyReceived * gl.unitCost;
    const newQty = bal.physical + gl.qtyReceived;
    if(newQty>0) p.cost = +(newTotal/newQty).toFixed(4);
    ledgerEntry(db,{movement:'receipt',productId:gl.productId,branchId:po.branchId,qtyPhysical:gl.qtyReceived,unitCost:gl.unitCost,sourceType:'grn',sourceId:grn.id,reference:grn.grnNo+' · '+po.poNo,userId:db.currentUserId});
    po.lines.find(x=>x.id===gl.id).qtyReceived = gl.qtyReceived;
  });
  po.status='received';
  db.goodsReceipts.push(grn);
  audit(db,'Received goods','grn',grn.id,grn.grnNo, `${grn.lines.length} lines · ${po.poNo}`);
  return {ok:true, grn};
}

/* ---------- transfers ---------- */
function makeTransfer(db, {fromBranchId, toBranchId, lines}){
  if(fromBranchId === toBranchId) return {ok:false,err:'Same branch'};
  // availability check
  for(const l of lines){
    const p = db.products.find(x=>x.id===l.productId);
    const avail = p.stock[fromBranchId].physical - p.stock[fromBranchId].reserved;
    if(avail < l.qty) return {ok:false,err:`Not enough ${p.name} (have ${avail})`};
  }
  const tr = {
    id:uid(), transferNo: nextNo(db,'tr','TR-',5),
    fromBranchId, toBranchId, raisedOn: TODAY_ISO,
    raisedBy: db.currentUserId, status:'in_transit',
    lines: lines.map((l,i)=>({...l, id:uid(), lineNo:i+1, qtyDispatched:l.qty, qtyReceived:0})),
    dispatchedAt: nowISO()
  };
  // dispatch: deduct at source immediately (in-transit is represented by the pending transfer record)
  tr.lines.forEach(tl=>{
    ledgerEntry(db,{movement:'transfer_out',productId:tl.productId,branchId:fromBranchId,qtyPhysical:-tl.qty,sourceType:'transfer',sourceId:tr.id,reference:tr.transferNo+' out',userId:db.currentUserId});
  });
  db.transfers.push(tr);
  audit(db,'Dispatched transfer','transfer',tr.id,tr.transferNo, `${lines.length} lines`);
  return {ok:true, tr};
}

function receiveTransfer(db, trId){
  const tr = db.transfers.find(x=>x.id===trId);
  if(!tr || tr.status!=='in_transit') return {ok:false,err:'Not in transit'};
  tr.lines.forEach(tl=>{
    ledgerEntry(db,{movement:'transfer_in',productId:tl.productId,branchId:tr.toBranchId,qtyPhysical:tl.qty,sourceType:'transfer',sourceId:tr.id,reference:tr.transferNo+' in',userId:db.currentUserId});
    tl.qtyReceived = tl.qty;
  });
  tr.status='received'; tr.receivedAt = nowISO();
  audit(db,'Received transfer','transfer',tr.id,tr.transferNo, 'complete');
  return {ok:true};
}

/* ---------- adjustments ---------- */
function makeAdjustment(db, {branchId, productId, qtyDelta, reason}){
  const p = db.products.find(x=>x.id===productId);
  const bal = p.stock[branchId];
  if(bal.physical + qtyDelta < 0) return {ok:false,err:'Would take stock negative'};
  const adj = {
    id:uid(), adjNo: nextNo(db,'adj','ADJ-',4),
    branchId, productId, qtyDelta, reason, status:'posted',
    createdAt: nowISO(), createdBy: db.currentUserId
  };
  ledgerEntry(db,{movement:'adjustment',productId,branchId,qtyPhysical:qtyDelta,reason,sourceType:'adjustment',sourceId:adj.id,reference:adj.adjNo+' '+reason,userId:db.currentUserId});
  db.adjustments.push(adj);
  audit(db,'Posted adjustment','adjustment',adj.id,adj.adjNo, `${qtyDelta>0?'+':''}${qtyDelta} · ${reason}`);
  return {ok:true, adj};
}

/* ---------- helpers ---------- */
function customerExposure(db, customerId){
  return db.invoices
    .filter(i=>i.customerId===customerId && i.status!=='paid' && i.status!=='void')
    .reduce((s,i)=>s+(i.total-i.amountPaid),0);
}
function permissionLimit(db, roleCode, key){
  const perms = db.rolePerms[roleCode] || {};
  return perms[key];
}
function userCan(db, action){
  const u = db.users.find(x=>x.id===db.currentUserId);
  if(!u) return false;
  const perms = db.rolePerms[u.role] || {};
  return !!perms[action] || perms[action] === 0;
}
function userBranchAccess(db, branchId){
  const u = db.users.find(x=>x.id===db.currentUserId);
  if(!u) return false;
  if(!u.branches || u.branches.length===0) return true;
  return u.branches.includes(branchId);
}
function stockAt(p, branchId){ return p.stock[branchId] || {physical:0,reserved:0}; }
function availableAt(p, branchId){ const s = stockAt(p,branchId); return s.physical - s.reserved; }
function productStatus(p, branchId){
  const s = stockAt(p, branchId);
  const a = s.physical - s.reserved;
  if(s.physical <= 0) return 'out';
  if(a <= p.reorderLevel) return 'low';
  return 'ok';
}

function scopeBranches(){
  if(state.branch==='all') return DB.branches;

}
function inScope(o){
  if(state.branch==='all') return true;
  return o.branchId===state.branch || o.branch===state.branch || o.fromBranchId===state.branch || o.toBranchId===state.branch;
}

function statusPill(s){
  const map = {
    draft:'idle', submitted:'info', approved:'info', confirmed:'warn',
    partially_delivered:'warn', delivered:'good', invoiced:'info',
    partially_paid:'warn', paid:'good', cancelled:'crit', rejected:'crit',
    ordered:'warn', received:'good', in_transit:'warn',
    packing:'warn', out_for_delivery:'info', open:'warn', overdue:'crit',
    active:'good', expired:'crit', ended:'idle', reserved:'info'
  };
  const labels = {draft:'Draft',submitted:'Submitted',approved:'Approved',confirmed:'Confirmed',
    partially_delivered:'Partially delivered',delivered:'Delivered',invoiced:'Invoiced',
    partially_paid:'Partially paid',paid:'Paid',cancelled:'Cancelled',rejected:'Rejected',
    ordered:'Ordered',received:'Received',in_transit:'In transit',

      <select id="invSt">${[['all','All stock'],['alert','Low or out'],['out','Out only'],['ok','Healthy']].map(([v,l])=>`<option value="${v}"${I.st===v?' selected':''}>${l}</option>`).join('')}</select>
      ${userCan(DB,'inv.adjust')?'<button class="btn" data-act="new-adj">Adjust stock</button>':''}
      ${userCan(DB,'tr.create')?'<button class="btn" data-act="new-tr">New transfer</button>':''}
    </div>
    <div id="invOut"></div>
  </div>`;
  updateInv();

function updateInv(){
  const I = state.inv, PS = 25;
  const q = I.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const brs = scopeBranches();
  const rows = DB.products.filter(p=>{
    if(I.cat!=='all' && p.category!==I.cat) return false;
    if(q.length && !q.every(w=>(p.name+' '+p.sku+' '+(p.scent||'')).toLowerCase().includes(w))) return false;
    if(I.st!=='all'){
      const sts = brs.map(b=>productStatus(p,b.id));
      if(I.st==='alert' && !sts.some(s=>s!=='ok')) return false;
      if(I.st==='out' && !sts.some(s=>s==='out')) return false;
      if(I.st==='ok' && !sts.every(s=>s==='ok')) return false;
    }
    return true;
  });
  const pages = Math.max(1, Math.ceil(rows.length/PS));
  if(I.page >= pages) I.page = pages-1;
  const slice = rows.slice(I.page*PS, I.page*PS+PS);
  const all = brs.length>1;
  const head = `<th>SKU</th><th>Product</th><th>Category</th>${brs.map(b=>`<th class="num">${all?b.id:'Physical'}</th>`).join('')}${all?`<th class="num">Reserved</th><th class="num">Available</th>`:`<th class="num">Reserved</th><th class="num">Available</th>`}<th class="num">Stock value</th>`;
  const body = slice.map(p=>{
    const s0 = stockAt(p, brs[0].id);
    const pval = brs.reduce((s,b)=>s+stockAt(p,b.id).physical*p.cost,0);
    return `<tr data-act="prod" data-pid="${p.id}" tabindex="0">
      <td class="mono">${p.sku}</td>
      <td><div class="pn">${esc(p.name)}</div></td>
      <td>${p.category}</td>
      ${brs.map(b=>{
        const s = stockAt(p,b.id);
        const a = s.physical - s.reserved;
        const cls = a<=0?'c-out':a<=p.reorderLevel?'c-low':'';
        return `<td class="num ${cls}">${all ? qf(p,s.physical) : qf(p,s.physical)}</td>`;
      }).join('')}
      <td class="num">${all?'—':qf(p,s0.reserved)}</td>
      <td class="num ${!all && (s0.physical-s0.reserved<=p.reorderLevel) ? 'c-low':''}">${all?'—':qf(p,s0.physical-s0.reserved)}</td>
      <td class="num">${money0(pval)}</td>
    </tr>`;
  }).join('');
  $('#invOut').innerHTML = (rows.length ? `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>` : '<div class="tablewrap"><p class="empty">No products match.</p></div>') +
    `<div class="pager"><span>${rows.length?`Showing ${I.page*PS+1}–${Math.min(rows.length,(I.page+1)*PS)} of ${rows.length}`:'0 results'}</span><div><button class="btn small" data-act="page" data-list="inv" data-d="-1"${I.page===0?' disabled':''}>Previous</button><button class="btn small" data-act="page" data-list="inv" data-d="1"${I.page>=pages-1?' disabled':''}>Next</button></div></div>`;
}

  const rows = brs.map(b=>{

    const a = s.physical - s.reserved;

    return `<tr><td>${esc(b.name)}</td><td class="num">${qf(p,s.physical)}</td><td class="num">${qf(p,s.reserved)}</td><td class="num ${cls}">${qf(p,a)}</td><td class="num">${p.reorderLevel}</td><td>${pillFor(productStatus(p,b.id))}</td></tr>`;

  openSheet(`
  <div class="sheet wide" role="dialog" aria-modal="true">
    <div class="sheet-h"><h2>${esc(p.name)}</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="sheet-b">
      <div class="meta">

        <div><span>Unit</span>${p.unit}</div>

        <div><span>Sale price</span>${money(p.price)}</div>
        <div><span>Reorder level</span>${p.reorderLevel}</div>

      <h4>Stock by branch</h4>

      ${tableHTML('<th>When</th><th>Movement</th><th>Reference</th><th>Branch</th><th class="num">Δ Physical</th>', mvRows)}

function pillFor(st){
  if(st==='ok') return '<span class="pill good">OK</span>';
  if(st==='low') return '<span class="pill warn">Low</span>';
  return '<span class="pill crit">Out</span>';
}
function tableHTML(head, rows){ return `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`; }

function applyAdjustment(pid){
  const branchId = $('#adjB').value;
  const qty = parseFloat($('#adjQ').value);
  const reason = $('#adjR').value;
  if(!qty) { toast('Enter a non-zero change'); return; }
  const res = makeAdjustment(DB, {branchId, productId:pid, qtyDelta:qty, reason});
  if(!res.ok){ toast(res.err); return; }
  save(); closeSheet(); render();
  toast(`Adjusted ${qty>0?'+':''}${qty}. New physical: ${qf(pfind(pid), stockAt(pfind(pid), branchId).physical)}`);
}

function openOrder(id){
  const o = DB.salesOrders.find(x=>x.id===id);
  if(!o) return;
  const steps = ['draft','submitted','confirmed','delivered','invoiced','paid'];
  const flow = {draft:0,submitted:1,confirmed:2,partially_delivered:2,delivered:3,invoiced:4,partially_paid:4,paid:5,cancelled:-1,rejected:-1};
  const idx = flow[o.status] ?? 0;
  const stepHTML = `<ul class="steps">${steps.map((s,i)=>`<li class="${i<idx?'done':i===idx?'now':''}">${s}</li>`).join('')}</ul>`;
  const lines = o.lines.map(l=>{
    const p = pfind(l.productId);
    return `<tr><td><div class="pn">${esc(p.name)}</div><div class="sub mono">${p.sku}</div></td><td class="num">${qf(p,l.qtyOrdered)}</td><td class="num">${qf(p,l.qtyReserved)}</td><td class="num">${qf(p,l.qtyDelivered)}</td><td class="num">${money(l.unitPrice)}</td><td class="num">${money0(l.qtyOrdered*l.unitPrice)}</td></tr>`;
  }).join('');
  const invs = DB.invoices.filter(i=>i.orderId===o.id);
  const dns = DB.deliveryNotes.filter(d=>d.orderId===o.id);
  const actions = [];
  if(o.status==='draft' && userCan(DB,'so.confirm')) actions.push(`<button class="btn primary" data-act="ord-confirm" data-id="${o.id}">Confirm & reserve</button>`);
  if(o.status==='confirmed' && userCan(DB,'so.confirm')) actions.push(`<button class="btn primary" data-act="ord-dispatch" data-id="${o.id}">Create delivery note</button>`);
  if(['delivered','partially_delivered'].includes(o.status) && userCan(DB,'so.confirm')) actions.push(`<button class="btn primary" data-act="ord-invoice" data-id="${o.id}">Create invoice</button>`);
  if(o.status==='invoiced' && o.balanceDue>0 && userCan(DB,'pay.record')) actions.push(`<button class="btn primary" data-act="ord-pay" data-id="${o.id}">Record payment</button>`);
  openSheet(`
  <div class="sheet wide" role="dialog" aria-modal="true">
    <div class="sheet-h"><h2>${o.orderNo} ${statusPill(o.status)}</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="sheet-b">
      ${o.status!=='cancelled' ? stepHTML : '<div class="callout crit">This order was cancelled. History is preserved.</div>'}
      <div class="meta">
        <div><span>Customer</span>${esc(cname(o.customerId))}</div>
        <div><span>Branch</span>${esc(bname(o.branchId))}</div>
        <div><span>Ordered</span>${dshort(o.orderedOn)} ${o.orderedAt}</div>
        <div><span>Balance</span>${o.balanceDue>0?money(o.balanceDue):'Settled'}</div>
      </div>
      <h4>Lines</h4>
      ${tableHTML('<th>Product</th><th class="num">Ordered</th><th class="num">Reserved</th><th class="num">Delivered</th><th class="num">Unit price</th><th class="num">Total</th>', lines)}
      <div class="bill">
        <div><span>Subtotal</span><span>${money(o.subtotal)}</span></div>
        ${o.discountTotal?`<div><span>Discount</span><span>−${money(o.discountTotal)}</span></div>`:''}
        <div class="total"><span>Order total</span><span>${money(o.total)}</span></div>
      </div>
      ${dns.length?`<h4>Delivery notes</h4>${tableHTML('<th>DN</th><th>Date</th><th class="num">Lines</th><th>Status</th>', dns.map(d=>`<tr><td class="mono">${d.dnNo}</td><td>${dshort(d.dnDate)}</td><td class="num">${d.lines.length}</td><td>${statusPill(d.status)}</td></tr>`).join(''))}`:''}
      ${invs.length?`<h4>Invoices</h4>${tableHTML('<th>Invoice</th><th>Date</th><th class="num">Total</th><th class="num">Paid</th><th>Status</th>', invs.map(i=>`<tr><td class="mono">${i.invoiceNo}</td><td>${dshort(i.invoiceDate)}</td><td class="num">${money0(i.total)}</td><td class="num">${money0(i.amountPaid)}</td><td>${statusPill(i.status)}</td></tr>`).join(''))}`:''}
    </div>
    <div class="sheet-f">
      <span class="sub">Reservation happens on confirm. Dispatch reduces physical stock.</span>
      <div class="btns">
        <button class="btn" data-act="close">Close</button>
        ${actions.join('')}
      </div>
    </div>
  </div>`);
}

function savePaymentAction(invoiceId){
  const amt = parseFloat($('#pay_amt').value);
  const method = $('#pay_method').value;
  const ref = $('#pay_ref').value.trim();
  if(!(amt>0)){ $('#pay_err').textContent = 'Enter a positive amount'; return; }
  const inv = DB.invoices.find(x=>x.id===invoiceId);
  if(amt > inv.balance + 0.001){ $('#pay_err').textContent = 'Amount exceeds balance'; return; }
  const res = recordPayment(DB, {invoiceId, amount:amt, method, reference:ref, direction:'in'});
  if(!res.ok){ $('#pay_err').textContent = res.err; return; }
  save(); closeSheet(); render();
  toast(`Payment ${res.payment.paymentNo} recorded: ${money(amt)}`);
}

  c.status = 'active';

  save(); closeSheet(); render(); toast('Contract started');
}
function endContractAction(id){
  const c = DB.contracts.find(x=>x.id===id);
  c.status='ended'; c.endedOn = TODAY_ISO;
  (c.refills||[]).forEach(r=>{ if(r.status==='scheduled') r.status='cancelled'; });
  audit(DB,'Ended contract','rental_contract',c.id,c.contractNo,'');
  save(); closeSheet(); render(); toast('Contract ended');
}
function deliverRefillAction(cid, seq){
  const c = DB.contracts.find(x=>x.id===cid);
  const r = (c.refills||[]).find(x=>x.seq===seq);
  if(!r || r.status!=='scheduled') return;
  const p = DB.products.find(x=>x.category==='BLK' && x.scent===c.oil.scent);
  if(!p){ toast('Bulk oil product missing'); return; }
  const needKg = +(r.oilMl * (DB.density[c.oil.scent]||0.9)/1000).toFixed(3);
  const have = stockAt(p, c.branchId).physical;
  if(have < needKg){ toast(`Short ${(needKg-have).toFixed(2)} kg of ${c.oil.scent}`); return; }
  ledgerEntry(DB,{movement:'fill_from_bulk',productId:p.id,branchId:c.branchId,qtyPhysical:-needKg,sourceType:'contract_refill',sourceId:c.id,reference:c.contractNo+' refill #'+seq,userId:DB.currentUserId});
  r.status='delivered'; r.deliveredOn = TODAY_ISO;
  audit(DB,'Delivered refill','rental_contract',c.id,c.contractNo,`seq ${seq}, ${needKg} kg`);
  save(); closeSheet(); render(); toast(`Refill delivered. ${have-needKg} kg of ${c.oil.scent} left.`);
}

/* ---------- refills ---------- */
views.refills = () => {
  const all = [];
  DB.contracts.filter(inScope).forEach(c=>{
    (c.refills||[]).forEach(r=>{
      if(state.rf.st==='Pending' && r.status!=='scheduled') return;
      if(state.rf.st==='Overdue' && !(r.status==='scheduled' && r.dueOn<TODAY_ISO)) return;
      if(state.rf.st==='Due today' && !(r.status==='scheduled' && r.dueOn===TODAY_ISO)) return;
      if(state.rf.st==='Delivered' && r.status!=='delivered') return;
      all.push({c,r});
    });
  });
  all.sort((a,b)=>a.r.dueOn.localeCompare(b.r.dueOn));
  const rows = all.map(({c,r})=>{
    const p = DB.products.find(x=>x.category==='BLK' && x.scent===c.oil.scent);
    const needKg = +(r.oilMl*(DB.density[c.oil.scent]||0.9)/1000).toFixed(3);
    const have = p?stockAt(p,c.branchId).physical:0;
    return `<tr data-act="ct-open" data-id="${c.id}" tabindex="0"><td>${dshort(r.dueOn)}</td><td class="mono">${c.contractNo}</td><td>${esc(cname(c.customerId))}</td><td>${esc(bname(c.branchId))}</td><td>${esc(c.oil.scent)}</td><td class="num">${r.oilMl} ml</td><td class="num ${have<needKg?'c-out':''}">${have.toFixed(2)} kg</td><td>${statusPill(r.status)}</td><td>${r.status==='scheduled'&&r.dueOn<=TODAY_ISO?`<button class="btn small" data-act="rf-deliver" data-id="${c.id}" data-seq="${r.seq}">Deliver</button>`:''}</td></tr>`;
  }).join('');
  $('#view').innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
    <div class="chips">${['Pending','Overdue','Due today','Delivered','All'].map(s=>`<button class="chip" data-act="rf-st" data-st="${s}" aria-pressed="${state.rf.st===s}">${s}</button>`).join('')}</div>
    ${rows ? tableHTML('<th>Due</th><th>Contract</th><th>Customer</th><th>Branch</th><th>Scent</th><th class="num">Oil</th><th class="num">Bulk on hand</th><th>Status</th><th></th>', rows) : '<div class="tablewrap"><p class="empty">No refills match.</p></div>'}
  </div>`;
};

/* ---------- reports ---------- */
views.reports = () => {
  const sel = state.rep.sel;
  const REPORTS = [
    ['valuation','Inventory valuation'],
    ['ar','AR ageing'],
    ['ap','AP ageing'],
    ['pl','Profit & loss'],
    ['stock','Stock reconciliation'],
    ['oil','Oil requirements (30 days)']
  ];
  let body = '';
  if(sel==='valuation'){
    const rows = DB.products.filter(p=>scopeBranches().some(b=>stockAt(p,b.id).physical>0)).map(p=>{
      const units = scopeBranches().reduce((s,b)=>s+stockAt(p,b.id).physical,0);
      const cost = units*p.cost;
      return `<tr><td>${esc(p.name)}</td><td class="mono">${p.sku}</td><td>${p.category}</td><td class="num">${qf(p,units)}</td><td class="num">${money(p.cost)}</td><td class="num">${money0(cost)}</td><td class="num">${money0(units*p.price)}</td></tr>`;
    }).join('');
    const totalCost = DB.products.reduce((s,p)=>s+scopeBranches().reduce((x,b)=>x+stockAt(p,b.id).physical*p.cost,0),0);
    body = tableHTML('<th>Product</th><th>SKU</th><th>Category</th><th class="num">Units</th><th class="num">Cost</th><th class="num">Value at cost</th><th class="num">Value at retail</th>', rows) +
      `<div class="kpis" style="margin-top:12px"><div class="kpi"><span class="l">Total stock value</span><span class="v">${money0(totalCost)}</span><span class="s">at weighted average cost</span></div></div>`;
  } else if(sel==='ar'){
    const rows = DB.invoices.filter(i=>i.status!=='paid' && i.status!=='void').map(i=>{
      const age = dayDiff(i.invoiceDate, TODAY_ISO);
      const b0 = age<=30?i.balance:0, b1 = age>30&&age<=60?i.balance:0, b2 = age>60&&age<=90?i.balance:0, b3 = age>90?i.balance:0;
      return `<tr><td class="mono">${i.invoiceNo}</td><td>${esc(cname(i.customerId))}</td><td>${dshort(i.invoiceDate)}</td><td class="num">${money0(i.balance)}</td><td class="num">${money0(b0)}</td><td class="num">${money0(b1)}</td><td class="num">${money0(b2)}</td><td class="num c-out">${money0(b3)}</td></tr>`;
    }).join('');
    body = tableHTML('<th>Invoice</th><th>Customer</th><th>Date</th><th class="num">Balance</th><th class="num">0–30d</th><th class="num">31–60d</th><th class="num">61–90d</th><th class="num">90+d</th>', rows);
  } else if(sel==='ap'){
    const rows = DB.purchaseOrders.filter(p=>p.status==='ordered').map(p=>`<tr><td class="mono">${p.poNo}</td><td>${esc(sname(p.supplierId))}</td><td>${dshort(p.orderedOn)}</td><td>${dshort(p.expectedOn)}</td><td class="num">${money0(p.subtotal)}</td></tr>`).join('');
    body = tableHTML('<th>PO</th><th>Supplier</th><th>Ordered</th><th>Expected</th><th class="num">Value</th>', rows) +
      `<p class="sub">Open POs (goods not yet received). Supplier invoices flow into AP once received.</p>`;
  } else if(sel==='pl'){
    const invoices = DB.invoices.filter(i=>i.status!=='void');
    const revenue = invoices.reduce((s,i)=>s+i.subtotal,0);
    const cogs = invoices.reduce((s,i)=>s+i.lines.reduce((x,l)=>x+l.qty*l.cogsUnitCost,0),0);
    const gp = revenue - cogs;
    const paid = DB.payments.filter(p=>p.direction==='out').reduce((s,p)=>s+p.amount,0);
    body = `<div class="tablewrap"><table><tbody>
      <tr><td>Gross sales (invoiced)</td><td class="num">${money0(revenue)}</td></tr>
      <tr><td>Cost of goods sold (WAC)</td><td class="num">−${money0(cogs)}</td></tr>
      <tr style="font-weight:600;border-top:1px solid var(--line)"><td>Gross profit</td><td class="num">${money0(gp)}</td></tr>
      <tr><td>Gross margin</td><td class="num">${revenue?((gp/revenue)*100).toFixed(1):0}%</td></tr>
      <tr style="border-top:1px solid var(--line)"><td>Cash paid to suppliers</td><td class="num">−${money0(paid)}</td></tr>
      <tr style="font-weight:700;border-top:2px solid var(--ink)"><td>Operating cash flow proxy</td><td class="num">${money0(gp-paid)}</td></tr>
    </tbody></table></div>
    <p class="sub">COGS uses weighted average cost captured on each invoice line at the time of invoicing. Cash paid is not COGS — purchases are an expense only when sold.</p>`;
  } else if(sel==='stock'){
    const rows = DB.products.filter(p=>scopeBranches().some(b=>stockAt(p,b.id).physical>0 || stockAt(p,b.id).reserved>0)).slice(0,20).map(p=>{
      const b = scopeBranches()[0];
      const s = stockAt(p,b.id);
      const ledgerBal = DB.ledger.filter(l=>l.productId===p.id && l.branchId===b.id).slice(-1)[0];
      return `<tr><td>${esc(p.name)}</td><td>${esc(b.name)}</td><td class="num">${qf(p,s.physical)}</td><td class="num">${qf(p,s.reserved)}</td><td class="num">${qf(p,s.physical-s.reserved)}</td><td class="num">${ledgerBal?num(ledgerBal.balancePhysical):'—'}</td><td>${(!ledgerBal || Math.abs(ledgerBal.balancePhysical-s.physical)<0.001)?'<span class="pill good">Match</span>':'<span class="pill crit">Variance</span>'}</td></tr>`;
    }).join('');
    body = tableHTML('<th>Product</th><th>Branch</th><th class="num">Physical</th><th class="num">Reserved</th><th class="num">Available</th><th class="num">Ledger closing</th><th>Recon</th>', rows) +
      `<p class="sub">Ledger closing is the last balance snapshot. Any mismatch is a bug, not a normal state.</p>`;
  } else if(sel==='oil'){
    const horizon = iso(addDays(TODAY,30));
    const rows = [];
    DB.contracts.filter(inScope).forEach(c=>{
      if(!c.oil || c.status==='ended') return;
      (c.refills||[]).forEach(r=>{
        if(r.status!=='scheduled' || r.dueOn>horizon) return;
        const p = DB.products.find(x=>x.category==='BLK' && x.scent===c.oil.scent);
        const needKg = +(r.oilMl*(DB.density[c.oil.scent]||0.9)/1000).toFixed(3);
        const have = p?stockAt(p,c.branchId).physical:0;
        rows.push(`<tr><td>${dshort(r.dueOn)}</td><td class="mono">${c.contractNo}</td><td>${esc(c.oil.scent)}</td><td>${esc(bname(c.branchId))}</td><td class="num">${needKg.toFixed(3)} kg</td><td class="num ${have<needKg?'c-out':''}">${have.toFixed(3)} kg</td><td>${have<needKg?'<span class="pill crit">Short</span>':'<span class="pill good">OK</span>'}</td></tr>`);
      });
    });
    body = rows.length ? tableHTML('<th>Due</th><th>Contract</th><th>Scent</th><th>Branch</th><th class="num">Need</th><th class="num">Have</th><th>Status</th>', rows.join('')) : '<div class="tablewrap"><p class="empty">No refills due in the next 30 days.</p></div>';
  }
  $('#view').innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
    <div class="chips">${REPORTS.map(([k,l])=>`<button class="chip" data-act="rep-sel" data-rep="${k}" aria-pressed="${sel===k}">${l}</button>`).join('')}</div>
    <h2 style="font-size:18px">${REPORTS.find(r=>r[0]===sel)[1]}</h2>
    ${body}
  </div>`;
};

function downloadFile(name, text){
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 500);
}
function exportCSV(what){
  let rows = [];
  if(what==='products'){
    rows = [['sku','name','category','scent','unit','cost','price','reorderLevel']].concat(
      DB.products.map(p=>[p.sku,p.name,p.category,p.scent||'',p.unit,p.cost,p.price,p.reorderLevel])
    );
  } else if(what==='customers'){
    rows = [['code','name','type','branch','limit','phone']].concat(DB.customers.map(c=>[c.code,c.name,c.type,c.branch,c.limit,c.phone||'']));
  } else if(what==='suppliers'){
    rows = [['code','name','categories','terms','leadTime']].concat(DB.suppliers.map(s=>[s.code,s.name,s.categories.join('|'),s.terms,s.leadTime]));
  } else if(what==='stock'){
    const r = [['sku','branch','physical','reserved','available','cost','value_at_cost']];
    DB.products.forEach(p=>DB.branches.forEach(b=>{ const s = stockAt(p,b.id); r.push([p.sku,b.id,s.physical,s.reserved,s.physical-s.reserved,p.cost,(s.physical*p.cost).toFixed(2)]); }));
    rows = r;
  } else if(what==='ledger'){
    rows = [['txnNo','at','movement','sku','branch','qtyPhysicalDelta','qtyReservedDelta','balancePhysical','balanceReserved','reference']].concat(
      DB.ledger.map(l=>{ const p = pfind(l.productId); return [l.txnNo,l.at,l.movement,p?p.sku:'',l.branchId,l.qtyPhysicalDelta,l.qtyReservedDelta,l.balancePhysical,l.balanceReserved,l.reference||'']; })
    );
  } else if(what==='orders'){
    rows = [['orderNo','date','customer','branch','status','total','paid','balance']].concat(
      DB.salesOrders.map(o=>[o.orderNo,o.orderedOn,cname(o.customerId),o.branchId,o.status,o.total,o.amountPaid||0,o.balanceDue])
    );
  } else if(what==='invoices'){
    rows = [['invoiceNo','date','due','customer','branch','total','paid','balance','status']].concat(
      DB.invoices.map(i=>[i.invoiceNo,i.invoiceDate,i.dueDate,cname(i.customerId),i.branchId,i.total,i.amountPaid,i.balance,i.status])
    );
  } else if(what==='backup'){
    downloadFile('stockroom-backup-'+TODAY_ISO+'.json', JSON.stringify(DB, null, 2));
    return;
  }
  const csv = rows.map(r=>r.map(c=>{
    const s = String(c==null?'':c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  downloadFile('stockroom-'+what+'-'+TODAY_ISO+'.csv', csv);
  toast('Exported '+what);
}
function importProducts(){
  const csv = $('#imp_csv').value.trim();
  if(!csv){ toast('Paste CSV first'); return; }
  const lines = csv.split(/\r?\n/).filter(Boolean);
  const header = lines.shift().split(',').map(s=>s.trim());
  let added=0, skipped=0;
  lines.forEach(line=>{
    const cells = line.split(',').map(s=>s.trim());
    const row = {}; header.forEach((h,i)=>row[h]=cells[i]);
    if(!row.sku || !row.name){ skipped++; return; }
    if(DB.products.find(p=>p.sku===row.sku)){ skipped++; return; }
    DB.products.push({
      id:uid(), sku:row.sku, name:row.name, category:row.category||'MISC', unit:row.unit||'pcs',
      cost:parseFloat(row.cost)||0, price:parseFloat(row.price)||0,
      reorderLevel:parseInt(row.reorderLevel)||0, trackLots:false, stock:{}, barcodes:[]
    });
    DB.branches.forEach(b=>{ DB.products[DB.products.length-1].stock[b.id]={physical:0,reserved:0}; });
    added++;
  });
  audit(DB,'Imported products','import',null,'inline-csv',`${added} added, ${skipped} skipped`);
  save(); render(); toast(`Imported ${added}, skipped ${skipped}`);
}
function importCustomers(){
  const csv = $('#imp_csv').value.trim();
  if(!csv){ toast('Paste CSV first'); return; }
  const lines = csv.split(/\r?\n/).filter(Boolean);
  const header = lines.shift().split(',').map(s=>s.trim());
  let added=0;
  lines.forEach(line=>{
    const cells = line.split(',').map(s=>s.trim());
    const row = {}; header.forEach((h,i)=>row[h]=cells[i]);
    if(!row.code || !row.name) return;
    if(DB.customers.find(c=>c.code===row.code)) return;
    DB.customers.push({id:uid(),code:row.code,name:row.name,type:row.type||'Retail or showroom',branch:row.branch||'DHK',limit:parseFloat(row.limit)||0,contact:'',phone:'',address:'',since:TODAY_ISO});
    added++;
  });

}

/* ============================================================================
   SHEET / MODAL
   ========================================================================== */
function openSheet(html){
  const o = $('#overlay');
  $('#sheetHost').innerHTML = html;
  o.hidden = false;
  const el = $('#sheetHost .sheet');
  const focusable = el ? el.querySelector('input,select,textarea,button') : null;
  if(focusable) focusable.focus({preventScroll:true});
  // focus trap
  document.addEventListener('keydown', trapFocus);
}
function closeSheet(){
  $('#overlay').hidden = true;
  $('#sheetHost').innerHTML = '';
  draft = null; kd = null;
  document.removeEventListener('keydown', trapFocus);
}
function trapFocus(e){
  if(e.key!=='Tab') return;
  const el = $('#sheetHost .sheet');
  if(!el) return;
  const f = el.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if(!f.length) return;
  const first = f[0], last = f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}

function renderDocLines(){

  const host = $('#docLines');
  if(!d.lines.length){ host.innerHTML = '<div class="tablewrap"><p class="empty">Add products above.</p></div>'; refreshDoc(); return; }
  const priced = t !== 'transfer';
  const head = `<th>Product</th><th class="num">Available</th><th class="num">Qty</th>${priced?`<th class="num">${t==='po'?'Unit cost':'Unit price'}</th><th class="num">Amount</th>`:''}<th></th>`;
  const rows = d.lines.map((l,i)=>{

    return `<tr data-i="${i}">

      <td class="num">${qf(p,avail)}</td>

    </tr>`;
  }).join('');

function refreshDoc(){
  const d = draft, t = d.type;
  let total = 0, bad = false, over = false;
  d.lines.forEach((l,i)=>{
    const p = pfind(l.productId);
    const qty = t==='transfer'?l.qty:l.qtyOrdered;
    const price = t==='po'?l.unitCost:l.unitPrice;
    const row = $(`#docLines tr[data-i="${i}"]`);
    let err = !(qty>0);
    if(t==='transfer' && qty > availableAt(p,d.branch)){ err = true; over = true; }
    if(t==='order' && qty > availableAt(p,d.branch)){ over = true; /* warn but allow (backorder) */ }
    if(row){
      row.classList.toggle('err', err);
      const a = row.querySelector('[data-amt]');
      if(a) a.textContent = money0(qty * price);
    }
    if(err) bad = true;
    total += qty * price;
  });
  if(t==='order') total = Math.max(0, total - (d.discountTotal||0));
  $('#docSum').textContent = t==='transfer'?`${d.lines.length} lines` : money0(total);
  $('#docMsg').textContent = over && t==='transfer' ? 'Quantity exceeds available stock.' : (over ? 'Some quantities exceed available — will go on backorder.' : '');
  const miss = !d.lines.length || (t==='transfer' && d.branch===d.to);
  $('#docSave').disabled = bad || miss;
}

function saveDoc(){

function refreshContract(){
  const d = kd;
  let monthly = 0, bad = false, over = false;
  d.lines.forEach((l,i)=>{
    const f = DB.fleet.find(x=>x.id===l.fleetModelId);
    const s = f.stock[d.branch];
    const booked = s.booked.reduce((x,k)=>x+k.qty,0);
    const free = s.owned - booked;
    const row = $(`#kLines tr[data-i="${i}"]`);
    const err = l.qty < 1 || l.qty > free;
    if(row) row.classList.toggle('err', err);
    if(err) bad = true;
    if(l.qty > free) over = true;
    monthly += l.qty * l.monthlyFee;
  });
  const sc = DB.density[d.scent] || 0.9;
  const totalMl = d.lines.reduce((s,l)=>{ const f=DB.fleet.find(x=>x.id===l.fleetModelId); return s+l.qty*f.oilMlPerMonth; },0);
  const perCycle = totalMl * d.interval;
  const kg = +(perCycle * sc / 1000).toFixed(3);
  const nRefills = d.oil==='inc' ? Math.ceil(d.term / d.interval) : 0;
  $('#kOil').textContent = d.oil==='none' ? 'Device-only contract. No refills scheduled.' : `Devices use ${totalMl} ml/month. Each delivery: ${perCycle} ml. ${nRefills} deliveries over the term. ~${kg} kg per refill.`;
  $('#kMsg').textContent = over ? 'Not enough free fleet units.' : '';
  $('#kSum').textContent = money0(monthly) + ' / month';
  $('#kSave').disabled = bad || !d.lines.length;
}
